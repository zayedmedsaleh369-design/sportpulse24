name: ScorePix Live - Hunter
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - run: pip install -r requirements.txt
      - run: python main.py
      - name: Save video
        uses: actions/upload-artifact@v3
        with:
          name: breaking-video
          path: final.mp4
