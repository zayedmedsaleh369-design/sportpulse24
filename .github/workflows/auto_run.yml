name: Run Sport Breaking Bot Automatically

on:
  schedule:
    - cron: '0 * * * *' # تشغيل تلقائي كل ساعة على مدار 24 ساعة
  workflow_dispatch: # يتيح لك تشغيله يدوياً بأي وقت بضغطة زر

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
            python-version: '3.10'

      - name: Run Script
        run: python main.py
